name: Bug report
description: Report a reproducible repository or installation defect
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what failed and what you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Mac model, memory, macOS, LM Studio, runtime, model key, quantization and context.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Reproduction commands
      description: Remove tokens, private paths and confidential data.
    validations:
      required: true
